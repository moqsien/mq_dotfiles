[main]
font=Inter:size=12              # 建议使用干净的无衬线字体
prompt="❯ "
icon-theme=Papirus-Dark         # 匹配 Noctalia 的图标风格
fields=name,generic,executable
password-character=*
filter-binaries=yes

[colors]
# 格式为 RRGGBBAA (最后两位是透明度)
background=1a1b26ff             # 深蓝黑背景 (Noctalia base)
text=c0caf5ff                   # 柔和的长白文本
match=7aa2f7ff                  # 搜索匹配高亮 (蓝色)
selection=292e42ff              # 选中项的背景色
selection-text=7aa2f7ff         # 选中项的文本色
selection-match=bb9af7ff        # 选中项中的匹配高亮 (紫色)
border=7aa2f7ff                 # 边框颜色

[border]
width=2
radius=10                       # 增加圆角，匹配 Noctalia 的现代感
