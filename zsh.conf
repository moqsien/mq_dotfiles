alias OnProxy="export http_proxy=http://127.0.0.1:2023;export https_proxy=http://127.0.0.1:2023;export no_proxy=127.0.0.1,localhost,::1"
OnProxy
alias OffProxy="unset http_proxy;unset https_proxy"

# envs
. "$HOME/.cargo/env"
export GOPATH="$HOME/my_projects/go"
export GOBIN="$GOPATH/bin"
export PATH="$PATH:$GOBIN"
export LONGCAT_API_KEY="any"
export QT_QPA_PLATFORM=wayland
export PATH="$HOME/.bun/bin:$PATH"

export AI_END_POINT="https://api.longcat.chat/openai/v1/chat/completions"
export AI_API_KEY="xxxxxxx"
export AI_MODEL="LongCat-Flash-Lite"
# export AI_MODEL="LongCat-Flash-Chat"

# alias
alias node="bun"
alias hx="helix"
alias nv="get_iflow_key && nvim"
alias authawsdorcker="aws ecr get-login --no-include-email --region ap-southeast-1 |  bash"
alias authbetadocker="aws ecr get-login --no-include-email --region us-west-2 | bash"
alias vibedoc="docker compose -f $HOME/vibe_projects/inlight-board/backend/go/doc/docker-compose.yml up"
alias hxgo="hx $HOME/vibe_projects/inlight-board/backend/go"
alias nvgo="nv $HOME/vibe_projects/inlight-board/backend/go"
alias cdgo="cd $HOME/vibe_projects/inlight-board/backend/go"
alias hxproto="hx $HOME/vibe_projects/inlight-board/proto"
alias nvproto="nv $HOME/vibe_projects/inlight-board/proto"
alias cdproto="cd $HOME/vibe_projects/inlight-board/proto"
alias hxdoc="hx $HOME/vibe_projects/backend_docs"
alias nvdoc="nv $HOME/vibe_projects/backend_docs"
alias cddoc="cd $HOME/vibe_projects/backend_docs"
alias nvswg="nv $HOME/vibe_projects/swagger-docs"
alias cdswg="cd $HOME/vibe_projects/swagger-docs"
alias nvlan="nv $HOME/.config/helix/languages.toml"
alias nvgho="nv $HOME/.config/ghostty/config"
alias nvzsh="nv $HOME/.zshrc"
alias loginhela="ssh hela@hela.local"
alias pm="atac"
alias xz="/usr/bin/xz"
alias oc="get_iflow_key && opencode"
alias cp="xcp"

alias ga="git add"
alias gc="git commit"
alias gp="git push"
alias gpl="git pull"
alias gst="git status"
alias gsw="git switch -C"
alias gswt="git switch --track"
alias gbde="git branch -d"
alias gbl="git branch -l"
alias gch="git checkout"
alias gco="git checkout ."
alias gd="git diff"
alias gpmm="git fetch origin && git merge origin/master"
alias gr="git reset --soft HEAD~1"

# Aliases Help
h() {
    echo -e "\033[1;34m=== My Custom Aliases Help ===\033[0m"
    printf "\033[1;32m%-15s\033[0m | %s\n" "Command" "Description"
    echo "------------------------------------------------------------"    
    echo -e "\n\033[1;33m[ AWS / Docker ]\033[0m"
    printf "%-15s | %s\n" "authawsdorcker" "Login to ECR (ap-southeast-1)"
    printf "%-15s | %s\n" "authbetadocker" "Login to ECR (us-west-2)"

    echo -e "\n\033[1;33m[ Navigation & Edit (Go / Proto / Docs) ]\033[0m"
    printf "%-15s | %s\n" "cdgo / hxgo" "Go to / Edit Backend Go project"
    printf "%-15s | %s\n" "cdproto / hxproto" "Go to / Edit Proto files"
    printf "%-15s | %s\n" "cddoc / hxdoc" "Go to / Edit Backend Docs"
    printf "%-15s | %s\n" "cdswg / hxswg" "Go to / Edit Swagger Docs"
    printf "%-15s | %s\n" "hxlan" "Edit helix languages.toml"
    printf "%-15s | %s\n" "hxgho" "Edit ghostty config file"
    printf "%-15s | %s\n" "hxfcodec" "Edit fcode config files"
    printf "%-15s | %s\n" "hxzsh" "Edit .zshrc"

    echo -e "\n\033[1;33m[ Git Shortcuts ]\033[0m"
    printf "%-15s | %s\n" "ga / gc" "Git Add/ Git Commit"
    printf "%-15s | %s\n" "gst / gd" "Git Status / Git Diff"
    printf "%-15s | %s\n" "gp / gpl" "Git Push / Git Pull"
    printf "%-15s | %s\n" "gch / gco" "Git Checkout / Git Checkout current dir"
    printf "%-15s | %s\n" "gsw / gswt" "Git Switch (New Branch) / Track"
    printf "%-15s | %s\n" "gbl / gbde" "List Branches / Delete Branch"
    printf "%-15s | %s\n" "gpmm" "Fetch and Merge origin/master"
    
    echo -e "\n\033[1;33m[ Others ]\033[0m"
    printf "%-15s | %s\n" "pm" "atac: a postman-like tool in cmdline"
    printf "%-15s | %s\n" "hx" "Restart fcode service and open Helix"
    printf "%-15s | %s\n" "loginhela" "SSH into hela.local"
    printf "%-15s | %s\n" "vibedoc" "Docker compose up for backend docs"
    echo "------------------------------------------------------------"
}

# end
eval "$(zoxide init zsh)"

function zvm_after_init() {
  bindkey "^R" fzf-history-widget
}

# To customize prompt, run `p10k configure` or edit ~/.p10k.zsh.
# [[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh
source /usr/share/zsh/plugins/zsh-vi-mode/zsh-vi-mode.plugin.zsh
ZVM_VI_INSERT_ESCAPE_BINDKEY=jk

bindkey -M emacs -r "^R"
bindkey -M viins -r "^R"
source <(fzf --zsh)

export STARSHIP_CONFIG=$HOME/.config/starship.toml
eval "$(starship init zsh)"

if [ -f /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh ]; then
    source /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh
fi

